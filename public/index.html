<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Autenticação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    
    <div class="card shadow p-4 text-center" style="max-width: 400px; width: 100%;">
        <h3 class="mb-4">Laboratório OAuth</h3>
        
        <div id="loadingArea">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-2 text-muted">Verificando sessão...</p>
        </div>

        <div id="loginArea" class="d-none">
            <p class="text-muted">Escolha um provedor para entrar:</p>
            <a href="/oauth/login/google" class="btn btn-danger w-100 mb-3">Entrar com Google</a>
            <a href="/oauth/login/github" class="btn btn-dark w-100">Entrar com GitHub</a>
        </div>

        <div id="profileArea" class="d-none">
            <div class="alert alert-success" role="alert">
                Autenticado via <strong id="providerName" class="text-capitalize"></strong>!
            </div>
            <p class="fw-bold mb-4" id="userEmail"></p>
            
            <form action="/oauth/logout" method="POST">
                <button type="submit" class="btn btn-outline-secondary w-100">Sair (Logout)</button>
            </form>
        </div>
    </div>

    <script>
        fetch('/api/me')
            .then(response => {
                document.getElementById('loadingArea').classList.add('d-none');
                
                if (response.ok) {
                    return response.json().then(data => {
                        document.getElementById('profileArea').classList.remove('d-none');
                        document.getElementById('providerName').innerText = data.provedor;
                        document.getElementById('userEmail').innerText = data.email;
                    });
                } else {
                    document.getElementById('loginArea').classList.remove('d-none');
                }
            })
            .catch(error => {
                console.error("Erro de conexão:", error);
                document.getElementById('loadingArea').classList.add('d-none');
                document.getElementById('loginArea').classList.remove('d-none');
            });
    </script>
</body>
</html>
