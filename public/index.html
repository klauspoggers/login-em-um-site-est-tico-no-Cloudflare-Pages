<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório de Autenticação</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <style>
        body {
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #000000);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            max-width: 420px;
            width: 100%;
            transition: transform 0.3s ease;
        }

        .glass-card:hover {
            transform: translateY(-5px);
        }
        .btn-google {
            background-color: #ea4335;
            color: white;
            border: none;
            transition: all 0.3s;
        }
        .btn-google:hover {
            background-color: #c5221f;
            color: white;
            box-shadow: 0 4px 15px rgba(234, 67, 53, 0.4);
        }

        .btn-github {
            background-color: #24292e;
            color: white;
            border: none;
            transition: all 0.3s;
        }
        .btn-github:hover {
            background-color: #111416;
            color: white;
            box-shadow: 0 4px 15px rgba(36, 41, 46, 0.4);
        }

        .btn-logout {
            background-color: transparent;
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background-color: #ff6b6b;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
        }

        .text-muted-custom {
            color: #adb5bd !important;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center vh-100 m-0">
    
    <div class="glass-card p-5 text-center mx-3">
        <div class="mb-4">
            <i class="bi bi-shield-lock text-primary" style="font-size: 3rem;"></i>
        </div>
        <h3 class="mb-2 fw-bold">Autenticação</h3>
        
        <div id="loadingArea" class="my-4">
            <div class="spinner-grow text-primary" role="status">
                <span class="visually-hidden">Carregando...</span>
            </div>
            <p class="mt-3 text-muted-custom">Estabelecendo conexão segura...</p>
        </div>

        <div id="loginArea" class="d-none mt-4">
            <p class="text-muted-custom mb-4">Escolha sua plataforma para continuar</p>
            <a href="/oauth/login/google" class="btn btn-google w-100 mb-3 py-2 fw-semibold rounded-pill">
                <i class="bi bi-google me-2"></i> Entrar com Google
            </a>
            <a href="/oauth/login/github" class="btn btn-github w-100 py-2 fw-semibold rounded-pill">
                <i class="bi bi-github me-2"></i> Entrar com GitHub
            </a>
        </div>

        <div id="profileArea" class="d-none mt-4">
            <div class="badge bg-success bg-opacity-25 text-success border border-success p-2 mb-3 rounded-pill w-100">
                <i class="bi bi-check-circle-fill me-1"></i> Acesso Liberado
            </div>
            <p class="text-muted-custom mb-1 small">Autenticado via <span id="providerName" class="text-capitalize text-white"></span></p>
            <p class="fw-bold fs-5 mb-4 text-truncate" id="userEmail" title=""></p>
            
            <form action="/oauth/logout" method="POST">
                <button type="submit" class="btn btn-logout w-100 py-2 fw-semibold rounded-pill">
                    <i class="bi bi-box-arrow-right me-2"></i> Encerrar Sessão
                </button>
            </form>
        </div>
    </div>

    <script>
        fetch('/api/me')
            .then(response => {
                document.getElementById('loadingArea').classList.add('d-none');
                
                if (response.ok) {
                    return response.json().then(data => {
                        document.getElementById('profileArea').classList.remove('d-none');
                        document.getElementById('providerName').innerText = data.provedor;
                        
                        const emailEl = document.getElementById('userEmail');
                        emailEl.innerText = data.email;
                        emailEl.title = data.email; 
                    });
                } else {
                    document.getElementById('loginArea').classList.remove('d-none');
                }
            })
            .catch(error => {
                console.error("Erro de conexão:", error);
                document.getElementById('loadingArea').classList.add('d-none');
                document.getElementById('loginArea').classList.remove('d-none');
            });
    </script>
</body>
</html>
